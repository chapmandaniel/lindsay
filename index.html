<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Childcare Payment Tracker</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="styles.css" rel="stylesheet">
</head>
<body>

    <!-- PIN Protection Overlay -->
    <div id="pin-overlay" class="d-flex justify-content-center align-items-center position-fixed top-0 start-0 w-100 h-100 bg-white" style="z-index: 1050;">
        <div class="card p-4 shadow-sm" style="max-width: 400px; width: 100%;">
            <h4 class="card-title text-center mb-4">Enter PIN</h4>
            <form id="pin-form">
                <div class="mb-3">
                    <input type="password" class="form-control text-center" id="pinInput" placeholder="Enter PIN to unlock" required>
                </div>
                <div id="pin-error" class="text-danger mb-3 d-none text-center">Incorrect PIN. Please try again.</div>
                <button type="submit" class="btn btn-primary w-100">Unlock</button>
            </form>
        </div>
    </div>

    <!-- App Wrapper (Initially Hidden) -->
    <div id="app-wrapper" class="d-none">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Childcare Tracker</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <button class="btn btn-outline-light me-2" data-bs-toggle="modal" data-bs-target="#customerModal" onclick="openCustomerModal(null)">Add Customer</button>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-outline-light me-2" data-bs-toggle="modal" data-bs-target="#closedDaysModal">Closed Days</button>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-outline-light" data-bs-toggle="modal" data-bs-target="#taxReceiptModal" onclick="populateReceiptCustomers()">Tax Receipts</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4" id="main-content">
        <div class="row">
            <div class="col-md-8">
                <h2>Due Payments</h2>
                <div id="payments-dashboard">
                    <!-- Payments will be injected here -->
                </div>
            </div>
            <div class="col-md-4">
                <h2>Customers</h2>
                <div id="customers-list">
                    <!-- Customers will be injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modals placeholder -->
    <div id="modals-container">
        <!-- Closed Days Modal -->
        <div class="modal fade" id="closedDaysModal" tabindex="-1" aria-labelledby="closedDaysModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form id="closed-days-form">
                        <div class="modal-header">
                            <h5 class="modal-title" id="closedDaysModalLabel">Manage Closed Days</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="closedDate" class="form-label">Add Closed Date</label>
                                <input type="date" class="form-control" id="closedDate" required>
                            </div>
                            <button type="submit" class="btn btn-sm btn-primary mb-3">Add Date</button>

                            <h6>Recorded Closed Days</h6>
                            <ul id="closed-days-list" class="list-group list-group-flush">
                                <!-- Closed days injected here -->
                            </ul>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Tax Receipt Modal -->
        <div class="modal fade" id="taxReceiptModal" tabindex="-1" aria-labelledby="taxReceiptModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form id="tax-receipt-form">
                        <div class="modal-header">
                            <h5 class="modal-title" id="taxReceiptModalLabel">Generate Tax Receipt</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="receiptCustomer" class="form-label">Select Customer</label>
                                <select class="form-select" id="receiptCustomer" required>
                                    <!-- Options injected here -->
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="quickTaxYear" class="form-label">Quick Select Tax Year</label>
                                <select class="form-select" id="quickTaxYear" onchange="handleTaxYearChange()">
                                    <option value="">-- Custom Date Range --</option>
                                    <option value="2024">2024</option>
                                    <option value="2025">2025</option>
                                    <option value="2026">2026</option>
                                    <option value="2027">2027</option>
                                    <option value="2028">2028</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="receiptStartDate" class="form-label">Start Date</label>
                                <input type="date" class="form-control" id="receiptStartDate" required>
                            </div>
                            <div class="mb-3">
                                <label for="receiptEndDate" class="form-label">End Date</label>
                                <input type="date" class="form-control" id="receiptEndDate" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Generate Receipt</button>

                            <div id="receipt-output" class="mt-4 d-none p-3 border rounded bg-light">
                                <!-- Receipt details injected here -->
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Customer Modal -->
        <div class="modal fade" id="customerModal" tabindex="-1" aria-labelledby="customerModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form id="customer-form">
                        <div class="modal-header">
                            <h5 class="modal-title" id="customerModalLabel">Add/Edit Customer</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <input type="hidden" id="customerId">
                            <div class="mb-3">
                                <label for="parentName" class="form-label">Parent's Name</label>
                                <input type="text" class="form-control" id="parentName" required>
                            </div>
                            <div class="mb-3">
                                <label for="childName" class="form-label">Child's Name</label>
                                <input type="text" class="form-control" id="childName" required>
                            </div>
                            <div class="mb-3">
                                <label for="startDate" class="form-label">Start Date</label>
                                <input type="date" class="form-control" id="startDate" required>
                            </div>
                            <div class="mb-3">
                                <label for="endDate" class="form-label">End Date (optional)</label>
                                <input type="date" class="form-control" id="endDate">
                            </div>
                            <div class="mb-3">
                                <label for="weeklyRate" class="form-label">Weekly Rate ($)</label>
                                <input type="number" class="form-control" id="weeklyRate" value="50.00" disabled>
                                <small class="text-muted">Rate is fixed at $50/week ($10/day, Mon-Fri).</small>
                            </div>
                        </div>
                        <div class="modal-footer justify-content-between">
                            <button type="button" class="btn btn-danger d-none" id="deleteCustomerBtn">Delete</button>
                            <div>
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                <button type="submit" class="btn btn-primary">Save Customer</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    </div> <!-- End of App Wrapper -->

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="app.js"></script>
</body>
</html>
